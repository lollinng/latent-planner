# Publish the static demo in web/ to GitHub Pages. Served at https://prathameshjadhav.in/latent-planner/
# through the user site's custom domain (no DNS change needed). Build and deploy are separate jobs so the
# artifact is finalised before deploy-pages looks it up.
name: pages
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Lets the page fetch model files from jsDelivr pinned to this exact commit (falls back to Pages).
      - run: echo '{"repo":"${{ github.repository }}","sha":"${{ github.sha }}"}' > web/deploy.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
